name: Sonatype Release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['*']

jobs:
  # One executable per platform, linked on that platform. The release job attaches them to the native module
  # as `re-scale_native0.5_3-<version>-<platform>.bin`, which `cs install` downloads (see README "Install").
  binaries:
    # PR snapshots let a change be tested before merging. Bot (Dependabot, Scala Steward) and fork PRs get no
    # secrets, so only trusted authors' PRs publish. Never drop this guard while `pull_request` is a trigger.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ${{ matrix.os }}
    name: Executable (${{ matrix.platform }})
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04,     platform: x86_64-pc-linux }
          - { os: ubuntu-22.04-arm, platform: aarch64-pc-linux }
          - { os: macos-15-intel,   platform: x86_64-apple-darwin }
          - { os: macos-15,         platform: aarch64-apple-darwin }
    env:
      # ubuntu-22.04 keeps the glibc floor at 2.35; the deployment target keeps macOS 11+ able to load it.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - uses: coursier/setup-action@v3.1.1
        with:
          jvm: 'temurin:17.0.15'
          apps: sbt
      - name: Install Scala Native build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libstdc++-12-dev
      - name: Link the executable
        run: sbt install
      - name: Check it runs and carries the tag's version
        run: |
          mkdir -p out
          cp .build/re-scale-bin "out/re-scale-${{ matrix.platform }}"
          "out/re-scale-${{ matrix.platform }}" --version
          if tag=$(git describe --tags --exact-match HEAD 2>/dev/null); then
            "out/re-scale-${{ matrix.platform }}" --version | grep -qx "re-scale $tag"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: re-scale-${{ matrix.platform }}
          path: out/re-scale-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  release:
    needs: binaries
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Publish Tag as Release' || 'Publish Snapshot' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required: version and release/snapshot decision come from git tags
      - uses: coursier/cache-action@v9
      - uses: actions/download-artifact@v4
        with:
          pattern: re-scale-*
          path: target/native-binaries
          merge-multiple: true
      - name: Require every platform's executable
        run: |
          ls -l target/native-binaries
          for p in x86_64-pc-linux aarch64-pc-linux x86_64-apple-darwin aarch64-apple-darwin; do
            test -s "target/native-binaries/re-scale-$p" || { echo "missing re-scale-$p"; exit 1; }
          done
      - name: Import GPG key for signing the release
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - uses: coursier/setup-action@v3.1.1
        with:
          jvm: 'temurin:17.0.15'
          apps: sbt
      - name: Publish all projects
        run: sbt ci-release
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
