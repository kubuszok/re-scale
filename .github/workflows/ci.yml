name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-formatting:
    runs-on: ubuntu-latest
    name: Check formatting
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/setup-action@v3.1.1
        with:
          apps: scalafmt
      - run: scalafmt --check

  jvm:
    runs-on: ubuntu-latest
    name: JVM
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - uses: coursier/setup-action@v3.1.1
        with:
          jvm: 'temurin:1.17.0.15'
          apps: sbt
      - name: Clean, compile, test (+ coverage), doc
        run: sbt ci-jvm-3

  # Every platform the release ships an executable for: the native suite runs on it, then the staged
  # executable (the same file `cs install` delivers, without the wrapper) is smoke-tested.
  native:
    runs-on: ${{ matrix.os }}
    name: Native (${{ matrix.platform }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     platform: x86_64-pc-linux }
          - { os: ubuntu-22.04-arm, platform: aarch64-pc-linux }
          - { os: macos-15-intel,   platform: x86_64-apple-darwin }
          - { os: macos-15,         platform: aarch64-apple-darwin }
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - uses: coursier/setup-action@v3.1.1
        with:
          jvm: 'temurin:1.17.0.15'
          apps: sbt
      - name: Install Scala Native build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libstdc++-12-dev time
      - name: Clean, stage, compile, test, doc
        run: sbt ci-native-3
      - name: Smoke test the executable
        run: |
          BIN=target/stage/bin/re-scale-bin
          "$BIN" --version
          "$BIN" --help > /dev/null
          OUT=$(echo '{"tool_name":"Bash","tool_input":{"command":"git status"}}' | "$BIN" hook)
          echo "allow: $OUT"; echo "$OUT" | grep -q '"permissionDecision":"allow"'
          OUT=$(echo '{"tool_name":"Bash","tool_input":{"command":"rm -rf /tmp/foo"}}' | "$BIN" hook)
          echo "deny: $OUT"; echo "$OUT" | grep -q '"permissionDecision":"deny"'
